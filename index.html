<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="100 Miles">
<title>100 Miles</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0f12;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 24px;
  }
  .stats {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat {
    background: #17191d;
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .stat .label {
    font-size: 14px;
    color: #9a9a9a;
    letter-spacing: 0.02em;
  }
  .stat .value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat.primary {
    background: #1c2a20;
    border: 1px solid #2e4a36;
  }
  .stat.primary .value { color: #6fe08a; font-size: 34px; }

  form {
    width: 100%;
    max-width: 360px;
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    font-size: 20px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid #2a2d33;
    background: #17191d;
    color: #f2f2f2;
    outline: none;
    min-width: 0;
  }
  input[type="text"]::placeholder { color: #666; }
  button {
    font-size: 18px;
    font-weight: 600;
    padding: 0 22px;
    border-radius: 14px;
    border: none;
    background: #3d7bff;
    color: white;
  }
  button:active { background: #2e63d6; }

  .total {
    margin-top: 18px;
    font-size: 13px;
    color: #777;
  }
  .undo {
    margin-top: 10px;
    font-size: 13px;
    color: #6fa8ff;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 4px;
  }
</style>
</head>
<body>

  <div class="stats">
    <div class="stat primary">
      <span class="label">Miles left</span>
      <span class="value" id="milesLeft">--</span>
    </div>
    <div class="stat">
      <span class="label">Days left</span>
      <span class="value" id="daysLeft">--</span>
    </div>
    <div class="stat">
      <span class="label">Miles/week needed</span>
      <span class="value" id="paceNeeded">--</span>
    </div>
  </div>

  <form id="addForm">
    <input type="text" inputmode="decimal" id="milesInput" placeholder="Miles run" autocomplete="off">
    <button type="submit">Add</button>
  </form>

  <div class="total" id="totalSoFar"></div>
  <button class="undo" id="undoBtn" style="display:none;">undo last entry</button>

<script>
  const GOAL = 100;
  const START_TOTAL = 11.92; // miles already logged as of setup
  const END_DATE = new Date(2026, 11, 31, 23, 59, 59); // Dec 31, 2026

  const STORAGE_KEY = 'miles_log_total';
  const LAST_ENTRY_KEY = 'miles_last_entry';

  function getTotal() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored === null) {
      localStorage.setItem(STORAGE_KEY, START_TOTAL);
      return START_TOTAL;
    }
    return parseFloat(stored);
  }

  function setTotal(val) {
    localStorage.setItem(STORAGE_KEY, val);
  }

  function daysRemaining() {
    const now = new Date();
    const diffMs = END_DATE - now;
    return Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
  }

  function render() {
    const total = getTotal();
    const left = Math.max(0, GOAL - total);
    const days = daysRemaining();
    const weeks = days / 7;
    const pace = weeks > 0 ? (left / weeks) : left;

    document.getElementById('milesLeft').textContent = left.toFixed(2);
    document.getElementById('daysLeft').textContent = days;
    document.getElementById('paceNeeded').textContent = pace.toFixed(2);
    document.getElementById('totalSoFar').textContent =
      total.toFixed(2) + ' / ' + GOAL + ' miles logged';

    const last = localStorage.getItem(LAST_ENTRY_KEY);
    document.getElementById('undoBtn').style.display = last ? 'inline-block' : 'none';
  }

  document.getElementById('addForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const input = document.getElementById('milesInput');
    const val = parseFloat(input.value);
    if (!isNaN(val) && val > 0) {
      const newTotal = getTotal() + val;
      setTotal(newTotal);
      localStorage.setItem(LAST_ENTRY_KEY, val);
      input.value = '';
      render();
    }
    input.blur();
  });

  document.getElementById('undoBtn').addEventListener('click', function() {
    const last = parseFloat(localStorage.getItem(LAST_ENTRY_KEY));
    if (!isNaN(last)) {
      setTotal(Math.max(0, getTotal() - last));
      localStorage.removeItem(LAST_ENTRY_KEY);
      render();
    }
  });

  render();
</script>
</body>
</html>
